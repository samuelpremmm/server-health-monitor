# Local CI/CD stack: Jenkins + SonarQube (with PostgreSQL) + Nexus.
#
#   cd ci
#   docker compose up -d --build
#
#   Jenkins    http://localhost:8080
#   SonarQube  http://localhost:9000
#   Nexus      http://localhost:8081
#
# Inside this network the containers reach each other by name:
#   http://jenkins:8080   http://sonarqube:9000   http://nexus:8081
#
# Uses about 5-6 GB of RAM while running. Stop with: docker compose stop
# The database password below is for this local demo only.

name: shm-cicd

services:
  jenkins:
    build: ./jenkins
    image: shm-jenkins:local
    container_name: jenkins
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    mem_limit: 2g
    restart: unless-stopped

  sonarqube-db:
    image: postgres:16.4
    container_name: sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    mem_limit: 512m
    restart: unless-stopped

  sonarqube:
    image: sonarqube:10.6.0-community
    container_name: sonarqube
    depends_on:
      - sonarqube-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    mem_limit: 3g
    restart: unless-stopped

  nexus:
    image: sonatype/nexus3:3.70.1
    container_name: nexus
    environment:
      INSTALL4J_ADD_VM_PARAMS: "-Xms1g -Xmx1g -XX:MaxDirectMemorySize=1g"
    ports:
      - "8081:8081"
    volumes:
      - nexus_data:/nexus-data
    mem_limit: 2560m
    restart: unless-stopped

volumes:
  jenkins_home:
  sonarqube_db:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  nexus_data:
