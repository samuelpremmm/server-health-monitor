# Prometheus: what to collect and how often.
global:
  scrape_interval: 15s       # collect every 15 seconds
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: prometheus     # Prometheus watches itself
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node           # node_exporter: standard Linux server metrics
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: health-monitor # my app's /metrics endpoint
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5000"]
