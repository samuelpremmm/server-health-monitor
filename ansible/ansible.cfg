# Ansible settings for this folder (run ansible-playbook from inside ansible/)
[defaults]
inventory = inventory.ini
roles_path = roles
# show results as readable YAML instead of one long JSON line
stdout_callback = yaml
# don't warn about the Python path on the server
interpreter_python = auto_silent

[ssh_connection]
# faster: send modules over the open SSH connection instead of copying files
pipelining = True
