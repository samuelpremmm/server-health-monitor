# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest
    - name: Run health monitor on Ubuntu
      run: |
        # 0 = OK, 1 = WARNING, 2 = CRITICAL are all valid reports; 3+ means the tool failed
        python -m health_monitor --disk / || status=$?
        echo "Exit code: ${status:-0} (0=OK, 1=WARNING, 2=CRITICAL)"
        test "${status:-0}" -le 2
    - name: Upload health report log
      uses: actions/upload-artifact@v4
      with:
        name: health-report
        path: logs/health_report.log

  # CD: runs on my EC2 server (self-hosted runner), only after tests pass
  # and only for pushes to main (never for pull requests).
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    concurrency: deploy-ec2   # one deploy at a time

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t health-monitor:${GITHUB_SHA::7} -t health-monitor:latest .

    - name: Replace the running container
      run: |
        docker rm -f health-monitor || true
        docker run -d --name health-monitor -p 5000:5000 --hostname "$(hostname)" \
          -v /:/host:ro -e DISK_PATHS=/host --restart unless-stopped \
          health-monitor:latest

    - name: Health check (/healthz)
      run: |
        for i in $(seq 1 15); do
          if curl -fsS http://127.0.0.1:5000/healthz; then
            echo; echo "Deploy OK: version ${GITHUB_SHA::7}"; exit 0
          fi
          sleep 2
        done
        echo "App did not become healthy"; docker logs --tail 50 health-monitor; exit 1

    - name: Clean up old images
      if: always()
      run: docker image prune -f
