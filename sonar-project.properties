# SonarQube analysis settings, read by sonar-scanner in the Jenkinsfile.
sonar.projectKey=server-health-monitor
sonar.projectName=Linux Server Health Monitor
sonar.sourceEncoding=UTF-8

# Code and tests
sonar.sources=health_monitor,scripts,monitor.py
sonar.tests=tests
sonar.python.version=3.8, 3.9, 3.10, 3.11, 3.12

# Reports produced by the Lint and Test stages
sonar.python.coverage.reportPaths=target/coverage.xml
sonar.python.xunit.reportPath=target/test-reports/junit.xml
sonar.python.flake8.reportPaths=target/flake8.txt

# Keep build output and the virtualenv out of the analysis
sonar.exclusions=.venv/**,target/**,showcase/**
